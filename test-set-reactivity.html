<!DOCTYPE html>
<html>
<head>
    <title>Test Set Reactivity</title>
</head>
<body>
    <h1>Test Set Reactivity</h1>
    <div id="output"></div>

    <script type="module">
        import { effect, State } from './dist/manifold.js';

        
        const output = document.getElementById('output');
        const log = (msg) => {
            console.log(msg);
            output.innerHTML += `<div>${msg}</div>`;
        };

        const state = State.create()
            .add("mySet", new Set(["a", "b", "c"]))
            .build();

        log("Initial state created");

        effect(() => {
            log(`Effect running: mySet = [${[...state.mySet].join(", ")}], size = ${state.mySet.size}`);
        });

        setTimeout(() => {
            log("Adding 'd' to mySet");
            state.mySet.add("d");
        }, 2000);

        setTimeout(() => {
            log("Deleting 'b' from mySet");
            state.mySet.delete("b");
        }, 4000);

        setTimeout(() => {
            log("Clearing mySet");
            state.mySet.clear();
        }, 6000);
    </script>
</body>
</html>
