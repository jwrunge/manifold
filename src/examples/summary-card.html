<section
	class="summary-card"
	:class:highlighted="highlight"
	:style:--accent-color="accentColor"
>
	<header class="summary-header">
		<span class="summary-chip">\${subtitle}</span>
		<h3 class="summary-title">\${title}</h3>
	</header>

	<p class="summary-description">\${description}</p>

	<div class="summary-metrics">
		<div class="summary-metric">
			<span class="metric-value">\${primaryValue}</span>
			<span class="metric-label">\${primaryLabel}</span>
		</div>
		<div class="summary-metric">
			<span class="metric-value">\${secondaryValue}</span>
			<span class="metric-label">\${secondaryLabel}</span>
		</div>
	</div>

	<footer class="summary-footer">
		<p class="summary-trend">\${trend}</p>
		<button type="button" data-mf-onclick="() => highlight = !highlight">
			Toggle highlight
		</button>
	</footer>
</section>
