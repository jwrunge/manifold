<!DOCTYPE html>
<html>
<head>
    <title>Test :each + :if</title>
</head>
<body data-mf-register>
    <h1>Test :each and :if on same element</h1>
    
    <div>
        <div 
            style="padding: 10px; margin: 5px; background: lightblue;"
            :each="items as item"
            :if="item.show"
        >
            Item: ${item.name}
        </div>
    </div>

    <script type="module">
        import { State } from './dist/manifold.js';

        
        State.create()
            .add("items", [
                { name: "Apple", show: true },
                { name: "Banana", show: false },
                { name: "Cherry", show: true },
                { name: "Date", show: false },
                { name: "Elderberry", show: true }
            ])
            .build();
    </script>
</body>
</html>
