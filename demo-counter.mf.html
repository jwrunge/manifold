<script type="module">
    import { State } from "./dist/manifold.js";

    export default State.component("#demo-counter")
        .add({
            label: "Counter",
            step: 1,
            count: 0,
        })
        .derive("doubled", (state) => state.count * 2)
        .derive("isEven", (state) => state.count % 2 === 0);
</script>

<template id="demo-counter">
    <div class="counter-widget">
        <h3>${label}</h3>
        <div class="count-display">
            <span class="count-value">${count}</span>
            <span class="count-info">
                (doubled: ${doubled}, ${isEven ? "even" : "odd"})
            </span>
        </div>
        <div class="controls">
            <button @click="count -= step">−</button>
            <button @click="count = 0">Reset</button>
            <button @click="count += step">+</button>
        </div>
    </div>
</template>
