<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manifold Components Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }

        h1 {
            color: #333;
        }

        section {
            margin-bottom: 3rem;
        }

        h2 {
            color: #666;
            border-bottom: 2px solid #007bff;
            padding-bottom: 0.5rem;
        }

        .demo-container {
            background: #f5f5f5;
            padding: 1.5rem;
            border-radius: 8px;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <h1>Manifold Components Demo</h1>

    <section>
        <h2>HTML-First Component (using .mf.html file)</h2>
        <div class="demo-container">
            <my-input></my-input>
            <my-input :type="'password'" :sync:inputValue="parentPassword"></my-input>
            <p>Parent knows the password value: ${parentPassword}</p>
        </div>
    </section>

    <section>
        <h2>TypeScript-First Component (defined in .ts file)</h2>
        <div class="demo-container">
            <my-counter></my-counter>
            <my-counter :sync:count="sharedCount"></my-counter>
            <p>Shared count from parent: ${sharedCount}</p>
        </div>
    </section>

    <script type="module">
        import { State, useComponent } from "./dist/manifold.js";

        // Load HTML-first component
        await useComponent("./component-test.mf.html");

        // Import TS-first component (auto-registers)
        await import("./component-test-ts.ts");

        // Create parent state
        const state = State.create("ComponentDemo")
            .add({
                parentPassword: "",
                sharedCount: 0,
            })
            .build();
    </script>
</body>
</html>
